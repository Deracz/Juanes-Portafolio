<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Presentación Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container d-flex justify-content-center">
        <div class="card custom-card p-4 text-center" style="max-width: 380px;">
            
            <div class="d-flex justify-content-center mt-3">
                <img src="Foto.png" class="rounded-circle profile-img" alt="Foto de perfil">
            </div>

            <div class="card-body mt-3">
                <h3 class="card-title fw-bold">Juan Esteban Oviedo Estepa</h3>
                <p class="text-primary fw-semibold mb-3">Java Full Stack Developer & IT Specialist</p>
                <p class="card-text text-muted small px-2">
                    Desarrollador de software, especializado en la optimización de sistemas y la creación de soluciones tecnológicas eficientes.
                </p>
            </div>

            <div class="d-flex justify-content-center gap-2 mb-3">
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=juanesoviedoestepa@gmail.com" target="_blank" class="btn btn-outline-danger btn-custom btn-sm rounded-pill px-3">
                    <i class="bi bi-envelope me-1"></i> Email
                </a>
                <a href="https://www.linkedin.com/in/juanesoviedo-it-support/" target="_blank" class="btn btn-outline-primary btn-custom btn-sm rounded-pill px-3">
                    <i class="bi bi-linkedin me-1"></i> LinkedIn
                </a>
                <a href="https://github.com/Deracz" target="_blank" class="btn btn-outline-dark btn-custom btn-sm rounded-pill px-3 bg-secondary text-white border-0">
                    <i class="bi bi-github me-1"></i> GitHub
                </a>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
